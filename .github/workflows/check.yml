name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model:
    name: model rebuild is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: pip install -r requirements-model.txt
      - name: rebuild from robot.yaml and compare with the committed files
        run: python hardware/build_all.py --check
      - name: build the example variants
        run: |
          for v in hardware/variants/*.yaml; do
            python hardware/build_all.py --config "$v" --out "build/$(basename "$v" .yaml)"
          done
      - name: MJCF matches the URDF
        run: python projects/sim_mirror/scripts/check_mjcf.py

  web:
    name: browser simulator builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/web_sim/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/web_sim/web/package-lock.json
      - run: npm ci
      - run: npm run build

  docs:
    name: docs build without warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs_site/requirements.txt
      - run: pip install -r docs_site/requirements.txt
      - run: sphinx-build -W --keep-going -b html docs_site/en _site
      - run: sphinx-build -W --keep-going -b html docs_site/zh _site/zh
