name: pages

# Builds the docs (English at /, Chinese at /zh/) and the browser simulator (/sim/) and deploys them to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs_site/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/web_sim/web/package-lock.json
      - run: pip install -r docs_site/requirements.txt
      - run: sphinx-build -b html docs_site/en _site
      - run: sphinx-build -b html docs_site/zh _site/zh
      - name: browser simulator -> /sim/
        working-directory: projects/web_sim/web
        run: npm ci && npm run build && cp -r dist "$GITHUB_WORKSPACE/_site/sim"
      - run: touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
